[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xquant-research"
version = "0.1.0"
description = "Reproducible quantitative strategy research utilities for the XQuant notebooks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.64",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "open-xquant @ git+https://github.com/xingwudao/open-xquant.git@c6894524498e6724f7b72135a581066c07dc34b8",
    "pandas>=3.0.3",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xquant"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
